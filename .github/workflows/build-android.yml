name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: court-android-signing-v140
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - name: Save installable APK in private repository
        run: |
          mkdir -p builds
          cp android/app/build/outputs/apk/debug/app-debug.apk builds/ALBAYDA-COURT-v1.4.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/ALBAYDA-COURT-v1.4.apk
          git commit -m 'Store installable ALBAYDA 1.4 APK'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: ALBAYDA-COURT-v1.4
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
