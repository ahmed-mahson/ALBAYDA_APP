name: Import reviewed application
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download verified private source bundle
        env:
          BUNDLE_URL: ${{ secrets.ALBAYDA_SETUP_BUNDLE_URL }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile, io
          raw = urllib.request.urlopen(os.environ['BUNDLE_URL'], timeout=60).read(10000000)
          if hashlib.sha256(raw).hexdigest() != 'ff8e9007d8c9966ee8390d533f845f6d07cc4ee4d8223e00a0567d9c2bad4f2b':
              raise RuntimeError('Source bundle checksum mismatch')
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for member in archive.infolist():
                  target = (root / member.filename).resolve()
                  relative = target.relative_to(root)
                  if '.git' in relative.parts:
                      raise RuntimeError('Invalid archive path')
                  if member.filename.startswith('.github/workflows/'):
                      continue
                  if not member.is_dir():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(member))
          print('Verified v1.2-derived source and private data extracted.')
          PY
      - name: Validate application
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --check web/app.js
          node --check web/login.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build corrected original application
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ALBAYDA-COURT-v1.3-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Commit corrected original application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git add -f data/sercase.csv data/snapshot-info.json
          if ! git diff --cached --quiet; then
            git commit -m 'Restore uploaded v1.2 native features, biometric login and transparent logo'
            git push origin HEAD:main
          fi
