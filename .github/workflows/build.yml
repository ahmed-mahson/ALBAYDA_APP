name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # هذه الخطوة تضمن وجود ملف gradlew، وإذا لم يجده تقوم بتنزيل Gradle وإنشائه
    - name: Generate Gradle Wrapper if missing
      run: |
        cd android
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found, generating..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build with Gradle
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ALBAYDA_APP_Debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
