name: Apply fullscreen UI
on:
  push:
    paths:
      - .github/workflows/apply-fullscreen.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python scripts/apply_fullscreen.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/ai/teable/albayda/court/preview/MainActivity.java android/app/build.gradle
          git commit -m 'Remove permanent server toolbar for fullscreen app; version 1.3.2'
          git push origin HEAD:main
