services:
  - type: web
    name: albayda-court
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_REQUIRE_AUTH
        value: "true"
      - key: PORT
        value: "10000"
      - key: ALBAYDA_HOST
        value: "0.0.0.0"
      - key: GOOGLE_DRIVE_FILE_ID
        value: "1wxYp5pvVh-8fWkW8OV1zMqWz90q59j8H"
      - key: GOOGLE_DRIVE_TOKEN
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        sync: false
