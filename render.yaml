services:
  - type: web
    name: albayda-court
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:application
    healthCheckPath: /healthz
    envVars:
      - key: APP_REQUIRE_AUTH
        value: "true"
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: GOOGLE_DRIVE_FILE_ID
        value: 1wxYp5pvVh-8fWkW8OV1zMqWz90q59j8H
