<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>تسجيل الدخول - محكمة البيضاء</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="login-container">
        <!-- الشعار هنا لن يظهر ضخماً بفضل ملف CSS -->
        <img src="/assets/app-icon-transparent.png" alt="شعار المحكمة" class="login-logo">
        
        <h1 class="login-title">محكمة البيضاء الابتدائية</h1>
        <p class="login-subtitle">الخدمات الإلكترونية - تسجيل الدخول</p>

        <form class="login-form" id="login-form">
            <input type="text" id="identity" class="login-input" placeholder="رقم الهاتف أو البريد الإلكتروني" required>
            <input type="password" id="password" class="login-input" placeholder="كلمة المرور" required>
            <button type="submit" class="login-btn">دخول</button>
        </form>
        <p id="login-error" style="color: red; margin-top: 15px; font-size: 13px;"></p>
    </div>

    <!-- ملف الجافا سكريبت الخاص بتسجيل الدخول -->
    <script src="/login.js" defer></script>
</body>
</html>
