<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>تسجيل الدخول - محكمة البيضاء</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
    
    <div class="login-container">
        <!-- الشعار -->
        <img src="/assets/app-icon-transparent.png" alt="شعار المحكمة" class="login-logo">
        
        <!-- العنوان -->
        <h1 class="login-title">تسجيل الدخول</h1>
        
        <!-- رسالة الخطأ (تظهر عند حدوث مشكلة) -->
        <div id="error-message" class="error-box" style="display: none;"></div>

        <!-- النموذج -->
        <form id="login-form" class="login-form">
            
            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <input type="text" id="identity" placeholder="رقم الهاتف أو البريد الإلكتروني" required>
            </div>

            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <input type="password" id="password" placeholder="كلمة المرور" required>
            </div>

            <button type="submit" class="login-btn" id="login-btn">دخول</button>
        </form>

        <!-- فاصل "أو" -->
        <div class="divider">
            <span>أو</span>
        </div>

        <!-- رابط إنشاء حساب -->
        <a href="/register.html" class="register-link">إنشاء حساب جديد</a>
    </div>

    <script src="/login.js" defer></script>
</body>
</html>
