<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تسجيل الدخول — محكمة البيضاء</title><style>@font-face{font-family:Sultan;src:url('/assets/sultan-medium.ttf')}*{box-sizing:border-box}body{margin:0;background:#f2f5f7;color:#182e3c;font:18px Sultan,Tahoma,sans-serif;line-height:1.7}header{background:#123e4a;color:white;padding:24px;display:flex;align-items:center;gap:20px}header img{width:76px;height:76px;object-fit:contain}h1{font-size:27px;margin:0}header p{margin:0}main{max-width:1150px;margin:24px auto;padding:0 18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button{cursor:pointer;background:#14646a;color:white;border:0;padding:10px 20px;border-radius:8px;font:inherit}button.secondary{background:#e3ecee;color:#123e4a}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bf8b27;outline-offset:3px}section,article{background:white;padding:24px;border:1px solid #dce5e8;border-radius:12px;margin-bottom:18px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;align-items:end}label{display:flex;flex-direction:column;gap:6px}input,select{width:100%;font:inherit;padding:9px;border:1px solid #9eafb5;border-radius:7px;background:white;color:#182e3c}p.hint{color:#52636b;font-size:16px}#notice{padding:12px;min-height:48px}#notice.error{color:#a01717;background:#fff0ef}dl{display:grid;grid-template-columns:minmax(100px,180px) 1fr;gap:8px 20px}dt{font-weight:bold}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}footer{text-align:center;padding:20px;color:#52636b}.login{max-width:470px;margin:50px auto}.login form{display:block}.login button{width:100%;margin-top:20px}[hidden]{display:none!important}@media(max-width:600px){header{padding:18px}h1{font-size:22px}section,article{padding:16px}dl{grid-template-columns:1fr;gap:3px}dd{margin-bottom:12px}}@media print{nav,form,button,#notice{display:none}body{background:white}article{break-inside:avoid}}
</style><body><main class="login"><section><img src="/assets/albayda-it-logo.webp" alt="شعار المحكمة" width="90"><h1>تسجيل الدخول</h1><p>تقنية معلومات محكمة البيضاء الابتدائية</p><form id="login"><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password" maxlength="256"></label><div id="device-options" hidden><label>الاسم للحفظ على هذا الهاتف<input name="device_name" autocomplete="username" minlength="3" maxlength="60"></label><label><span><input type="checkbox" name="remember" style="width:auto"> حفظ بيانات الدخول على هذا الهاتف</span></label><p class="hint">لحفظ الدخول بالبصمة، استخدم كلمة مرور رقمية من 12 إلى 128 رقمًا. يظهر خيار تفعيل البصمة عند الحفظ.</p></div><button>دخول</button></form><div id="native-actions" hidden><button id="saved" class="secondary" hidden>الدخول بالبيانات المحفوظة</button><button id="biometric" class="secondary" hidden>الدخول بالبصمة</button><button id="forget" class="secondary" hidden>نسيان بيانات هذا الهاتف</button></div><p id="message" role="alert"></p></section></main><script src="/login.js" defer></script></body></html>
