plugins { id 'com.android.application' }
def courtUrl = providers.gradleProperty('appUrl').getOrElse('').trim()
if (!courtUrl) courtUrl = 'https://albayda-court.onrender.com/'
def parsedUrl = new URI(courtUrl)
if (courtUrl && (parsedUrl.scheme != 'https' || !parsedUrl.host || parsedUrl.userInfo || parsedUrl.query || parsedUrl.fragment || !(parsedUrl.path in ['', '/']))) {
    throw new GradleException('appUrl must be an HTTPS origin, for example https://court.example.org/')
}
android {
    namespace 'ai.teable.albayda.court.preview'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.teable.albayda.court.preview'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '1.4.0'
        buildConfigField 'String', 'APP_URL', '"' + courtUrl + '"'
    }
    buildFeatures { buildConfig true }
}
