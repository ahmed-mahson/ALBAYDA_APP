plugins {
    id 'com.android.application'
}

android {
    // اسم الحزمة (تأكد أنه يطابق اسم الحزمة الموجود في MainActivity.java)
    namespace 'ai.teable.albayda.court.preview'
    compileSdk 34

    defaultConfig {
        applicationId "ai.teable.albayda.court.preview"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    // إذا كنت تستخدم Kotlin، أزل التعليق عن السطرين التاليين:
    // kotlinOptions {
    //     jvmTarget = '1.8'
    // }
}

dependencies {
    // هذه المكتبة هي التي كانت مفقودة وتسببت في الخطأ
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // مكتبات أساسية أخرى ينصح بوجودها
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // مكتبات الاختبار (اختيارية)
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
